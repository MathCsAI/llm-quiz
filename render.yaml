# Configuration for Render.com deployment
services:
  - type: web
    name: llm-quiz-solver
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      playwright install chromium
      playwright install-deps chromium
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: EMAIL
        sync: false
      - key: AI_PIPE_TOKEN
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.6
    healthCheckPath: /
