name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Mirror repo to HF Space
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_USERNAME: ${{ secrets.HF_USERNAME }}
      HF_SPACE_NAME: llm-quiz-solver
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify secrets
        run: |
          test -n "$HF_USERNAME" || (echo "HF_USERNAME is not set" && exit 1)
          test -n "$HF_TOKEN" || (echo "HF_TOKEN is not set" && exit 1)

      - name: Configure git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Add HF remote
        run: |
          git remote add hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}.git" || \
          git remote set-url hf "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}.git"
          git remote -v

      - name: Push to HF Space
        run: |
          git fetch hf || true
          git push hf HEAD:main --force
